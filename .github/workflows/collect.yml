name: Coleta de vagas

on:
  schedule:
    # 07:47 e 17:47 em Brasília (UTC-3). Fora da hora cheia de propósito: é quando o GitHub
    # tem mais fila e costuma atrasar ou pular execuções agendadas.
    - cron: "47 10 * * *"
    - cron: "47 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Duas coletas simultâneas disputariam as mesmas vagas no banco.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Coletar, pontuar e gravar
        run: npm run collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          LLM_WEIGHT: ${{ vars.LLM_WEIGHT }}
          SALARY_FLOOR_BRL: ${{ vars.SALARY_FLOOR_BRL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Resumo diário no Telegram só na coleta da manhã.
          SEND_DIGEST: ${{ github.event.schedule == '47 10 * * *' && '1' || '' }}
          PANEL_URL: ${{ vars.PANEL_URL }}
